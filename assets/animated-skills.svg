<svg xmlns="http://www.w3.org/2000/svg" width="900" height="90" viewBox="0 0 900 90" role="img" aria-label="Skills &amp; Tools"><defs><linearGradient id="bg"><stop stop-color="#091525"/><stop offset="1" stop-color="#192346"/></linearGradient><linearGradient id="a"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><style>.beam{animation:travel 8s ease-in-out infinite}.tile{animation:lit 6s ease-in-out infinite}.dot{animation:lit 3s ease-in-out infinite}@keyframes travel{0%,100%{transform:translateX(0)}50%{transform:translateX(640px)}}@keyframes lit{0%,100%{stroke-opacity:.2;opacity:.65}50%{stroke-opacity:1;opacity:1}}@media(prefers-reduced-motion:reduce){.beam,.tile,.dot{animation:none}}</style><rect x="1" y="1" width="898" height="88" rx="18" fill="url(#bg)" stroke="#263953"/><circle class="dot" cx="30" cy="35" r="5" fill="#22d3ee"/><text x="48" y="42" fill="#f1f5f9" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="24">Skills &amp; Tools</text><rect x="24" y="62" width="852" height="2" fill="#24344c"/><rect class="beam" x="24" y="62" width="180" height="2" fill="url(#a)"/></svg>