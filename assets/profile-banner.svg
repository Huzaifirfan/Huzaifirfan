<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="390" viewBox="0 0 1280 390" role="img" aria-labelledby="title desc">
<title id="title">Huzaif Irfan — Data Analytics</title><desc id="desc">Animated analytics banner with rising bars, a drawing trend line and gently pulsing data points.</desc>
<defs>
<linearGradient id="bg"><stop stop-color="#07111f"/><stop offset=".6" stop-color="#102954"/><stop offset="1" stop-color="#28245f"/></linearGradient>
<linearGradient id="accent"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<pattern id="grid" width="65" height="65" patternUnits="userSpaceOnUse"><path d="M65 0H0V65" fill="none" stroke="#94a3b8" stroke-opacity=".09"/></pattern>
<style>.accent{animation:breathe 10s ease-in-out infinite}@keyframes breathe{0%,100%{opacity:.45}50%{opacity:.8}}@media(prefers-reduced-motion:reduce){.accent{animation:none}}</style></defs>
<rect width="1280" height="390" rx="28" fill="url(#bg)"/>
<rect width="1280" height="390" rx="28" fill="url(#grid)"/>
<circle class="halo" cx="1080" cy="130" r="155" fill="#38bdf8" opacity=".12"/>
<circle class="halo" cx="170" cy="310" r="160" fill="#8b5cf6" opacity=".10"/>
<g fill="url(#accent)">
<rect class="bar" x="58" y="259" width="25" height="65" rx="5"/>
<rect class="bar b2" x="101" y="218" width="25" height="106" rx="5"/>
<rect class="bar b3" x="144" y="174" width="25" height="150" rx="5"/>
<rect class="bar b4" x="187" y="133" width="25" height="191" rx="5"/>
</g>
<path class="trend" d="M42 245L96 216L144 231L189 164L247 130" fill="none" stroke="#67e8f9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<g fill="#a5f3fc"><circle class="dot" cx="96" cy="216" r="5"/><circle class="dot d2" cx="189" cy="164" r="5"/><circle class="dot d3" cx="247" cy="130" r="5"/></g>
<rect x="280" y="81" width="720" height="225" rx="24" fill="#07111f" fill-opacity=".75" stroke="#93c5fd" stroke-opacity=".16"/>
<text x="640" y="151" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="800" letter-spacing="2">HUZAIF IRFAN</text>
<rect x="580" y="173" width="120" height="3" rx="1.5" fill="url(#accent)"/>
<text x="640" y="215" text-anchor="middle" fill="#bae6fd" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700">DATA ANALYTICS · BUSINESS ANALYSIS · BI</text>
<text x="640" y="260" text-anchor="middle" fill="#cbd5e1" font-family="Arial,Helvetica,sans-serif" font-size="18">Turning complex data into clear, decision-ready insights.</text>
<circle cx="1121" cy="133" r="61" fill="none" stroke="#93c5fd" stroke-opacity=".12" stroke-width="17"/>
<circle class="dot" cx="1121" cy="133" r="61" fill="none" stroke="#38bdf8" stroke-width="17" stroke-dasharray="240 384" transform="rotate(-90 1121 133)"/>
<path class="trend" d="M1030 299L1068 267L1101 279L1138 233L1174 249L1225 198" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<g fill="#67e8f9"><circle class="dot" cx="1068" cy="267" r="5"/><circle class="dot d2" cx="1138" cy="233" r="5"/><circle class="dot d3" cx="1225" cy="198" r="5"/></g>
<text x="640" y="351" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="15" letter-spacing="2">ANALYZE · UNDERSTAND · VISUALIZE · COMMUNICATE</text>
</svg>