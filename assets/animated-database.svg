<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-label="Database &amp; SQL"><defs><linearGradient id="bg"><stop stop-color="#091525"/><stop offset="1" stop-color="#192346"/></linearGradient><linearGradient id="a"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><style>.beam{animation:travel 8s ease-in-out infinite}.tile{animation:lit 6s ease-in-out infinite}.dot{animation:lit 3s ease-in-out infinite}@keyframes travel{0%,100%{transform:translateX(0)}50%{transform:translateX(640px)}}@keyframes lit{0%,100%{stroke-opacity:.2;opacity:.65}50%{stroke-opacity:1;opacity:1}}@media(prefers-reduced-motion:reduce){.beam,.tile,.dot{animation:none}}</style><rect x="1" y="1" width="898" height="188" rx="18" fill="url(#bg)" stroke="#263953"/><circle class="dot" cx="30" cy="35" r="5" fill="#22d3ee"/><text x="48" y="42" fill="#f1f5f9" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="24">Database &amp; SQL</text><rect x="24" y="62" width="852" height="2" fill="#24344c"/><rect class="beam" x="24" y="62" width="180" height="2" fill="url(#a)"/><g><rect class="tile" style="animation-delay:0s" x="24" y="85" width="204" height="58" rx="11" fill="#0b192d" stroke="#22d3ee"/><text x="126" y="121" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="19" fill="#e2e8f0">MySQL</text></g><g><rect class="tile" style="animation-delay:0.6s" x="240" y="85" width="204" height="58" rx="11" fill="#0b192d" stroke="#a78bfa"/><text x="342" y="121" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="19" fill="#e2e8f0">Joins</text></g><g><rect class="tile" style="animation-delay:1.2s" x="456" y="85" width="204" height="58" rx="11" fill="#0b192d" stroke="#22d3ee"/><text x="558" y="121" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="19" fill="#e2e8f0">Filtering</text></g><g><rect class="tile" style="animation-delay:1.7999999999999998s" x="672" y="85" width="204" height="58" rx="11" fill="#0b192d" stroke="#a78bfa"/><text x="774" y="121" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="19" fill="#e2e8f0">Aggregation</text></g><text x="26" y="172" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="14">Organize data and turn business questions into queries.</text></svg>