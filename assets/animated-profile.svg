<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-label="Professional Profile"><defs><linearGradient id="bg"><stop stop-color="#091525"/><stop offset="1" stop-color="#192346"/></linearGradient><linearGradient id="a"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><style>.accent{animation:breathe 10s ease-in-out infinite}@keyframes breathe{0%,100%{opacity:.45}50%{opacity:.8}}@media(prefers-reduced-motion:reduce){.accent{animation:none}}</style><rect x="1" y="1" width="898" height="188" rx="18" fill="url(#bg)" stroke="#263953"/><circle class="dot" cx="30" cy="35" r="5" fill="#22d3ee"/><text x="48" y="42" fill="#f1f5f9" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="24">Professional Profile</text><rect x="24" y="62" width="852" height="2" fill="#24344c"/><rect class="accent" x="24" y="62" width="180" height="2" fill="url(#a)"/><g><rect class="tile" style="animation-delay:0s" x="24" y="85" width="276" height="58" rx="11" fill="#0b192d" stroke="#22d3ee"/><text x="162" y="121" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="19" fill="#e2e8f0">Data Analytics</text></g><g><rect class="tile" style="animation-delay:0.6s" x="312" y="85" width="276" height="58" rx="11" fill="#0b192d" stroke="#a78bfa"/><text x="450" y="121" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="19" fill="#e2e8f0">Business Analysis</text></g><g><rect class="tile" style="animation-delay:1.2s" x="600" y="85" width="276" height="58" rx="11" fill="#0b192d" stroke="#22d3ee"/><text x="738" y="121" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="19" fill="#e2e8f0">Business Intelligence</text></g><text x="26" y="172" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="14">Clear reporting. Practical analysis. Business-focused insights.</text></svg>